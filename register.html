<!DOCTYPE html>
<html>
<head>
<title>AzureBay Register ✨</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Segoe UI', sans-serif;
}
.box{
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    padding:35px;
    border-radius:30px;
    width:380px;
    text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.8);
}
.box h1{ color:#0a3d62; margin-bottom:5px; }
.box h2{ color:#667eea; font-weight:300; letter-spacing:2px; }
input{
    width:100%;
    padding:14px 18px;
    margin:10px 0;
    border-radius:25px;
    border:1.5px solid #e0e0e0;
    outline:none;
    box-sizing:border-box;
    transition:0.3s;
    font-size:14px;
}
input:focus{ border-color:#667eea; box-shadow:0 0 8px rgba(102,126,234,0.3); }
button{
    width:100%;
    padding:14px;
    border-radius:25px;
    border:none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    margin-top:15px;
    box-shadow:0 8px 15px rgba(102,126,234,0.4);
    transition:0.3s;
}
button:hover{ transform:translateY(-2px); box-shadow:0 12px 20px rgba(102,126,234,0.5); }
a{color:#667eea; text-decoration:none; font-weight:600;}
</style>
</head>
<body>
<div class="box">
    <h1>🌊 AzureBay 🦈</h1>
    <h2>✨ Create Account ✨</h2>
    <form action="/register" method="POST">
        <input type="text" name="name" placeholder="👤  Your Name  —  Ex: Nidha ✨" required>
        <input type="email" name="email" placeholder="📧  Email  —  nidha@gmail.com 💌" required>
        <input type="password" name="password" placeholder="🔒  Create Password  —  ••••••••" required>
        <button type="submit">💫 Register Now 💫</button>
    </form>
    <p style="margin-top:20px; font-size:14px; color:#555;">Already have an account? <a href="/login.html">Login 💙 →</a></p>
</div>
</body>
</html>
